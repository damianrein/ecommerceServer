server:
  port: 8080
eureka:
  client:
    register-with-eureka: true


spring:
  application:
    name: msvc-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: microservice-users
          uri: lb://microservice-users
          predicates:
            - Path=/users/**
        - id: microservice-product
          uri: lb://microservice-product
          predicates:
            - Path=/product/**
        - id: microservice-order
          uri: lb://microservice-order
          predicates:
            - Path=/order/**
        - id: microservice-reviews
          uri: lb://microservice-reviews
          predicates:
            - Path=/reviews/**